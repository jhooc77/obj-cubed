name: Apply macOS hybrid backend

on:
  push:
    branches:
      - agent/macos-hybrid-compat
    paths:
      - .github/workflows/apply-macos-hybrid.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macos-hybrid-compat
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize compatibility tooling
        shell: bash
        run: |
          set -euo pipefail
          if [ -f tools/macos-hybrid/install.py ]; then
            echo 'Compatibility tooling is already materialized.'
          else
            cat tools/macos-hybrid-payload/part-*.b64 > /tmp/macos-hybrid-tools.tar.gz.b64
            base64 -d /tmp/macos-hybrid-tools.tar.gz.b64 > /tmp/macos-hybrid-tools.tar.gz
            echo '438ac872a1c5ea8dd4484811c4209d8804edc686ffebb85a83f5438dd3e91c7f  /tmp/macos-hybrid-tools.tar.gz' | sha256sum -c -
            mkdir -p tools/macos-hybrid
            tar -xzf /tmp/macos-hybrid-tools.tar.gz -C tools/macos-hybrid
          fi
          rm -rf \
            /tmp/macos-hybrid-tools.tar.gz \
            /tmp/macos-hybrid-tools.tar.gz.b64 \
            tools/macos-hybrid-payload \
            tools/macos-hybrid-payload.tar.gz.b64

      - name: Apply backend to the real checkout
        run: python3 tools/macos-hybrid/install.py .

      - name: Remove installer backups
        run: find . -type f -name '*.pre-hybrid-surface' -delete

      - name: Validate generated JavaScript and hybrid structure
        run: |
          node --check objcubed.js
          python3 tools/macos-hybrid/validate_actual.py
          python3 tools/macos-hybrid/tests/test_static_surface_math.py
          node tools/macos-hybrid/tests/test_surface_helper.mjs

      - name: Install upstream test dependencies
        run: npm install --ignore-scripts --force

      - name: Run upstream tests and preserve diagnostics
        id: upstream-tests
        shell: bash
        run: |
          set +e
          npm test > upstream-tests.log 2>&1
          unit_status=$?
          if [ -f test/validate-pack.mjs ]; then
            npm run test:pack >> upstream-tests.log 2>&1
            pack_status=$?
          else
            echo 'SKIP test:pack: test/validate-pack.mjs is absent in the upstream checkout.' >> upstream-tests.log
            pack_status=0
          fi
          cat upstream-tests.log
          if [ "$unit_status" -eq 0 ] && [ "$pack_status" -eq 0 ]; then
            echo 'status=0' >> "$GITHUB_OUTPUT"
          else
            echo 'status=1' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload upstream test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: upstream-test-log
          path: upstream-tests.log
          if-no-files-found: error

      - name: Build downloadable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          zip -qr dist/obj-cubed-macos-hybrid.zip . \
            -x '.git/*' 'node_modules/*' 'dist/*' 'upstream-tests.log' '*.pre-hybrid-surface'
          sha256sum dist/obj-cubed-macos-hybrid.zip > dist/obj-cubed-macos-hybrid.zip.sha256

      - name: Upload patched repository ZIP
        uses: actions/upload-artifact@v4
        with:
          name: obj-cubed-macos-hybrid
          path: dist/*
          if-no-files-found: error

      - name: Commit generated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            objcubed.js \
            objcubed \
            HYBRID_SURFACE_PATCH.json \
            tools/macos-hybrid
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Add macOS hybrid static-surface backend'
          git push origin HEAD:agent/macos-hybrid-compat

      - name: Enforce upstream test result
        if: steps.upstream-tests.outputs.status != '0'
        run: |
          echo 'Upstream tests failed; inspect the upstream-test-log artifact.'
          exit 1
